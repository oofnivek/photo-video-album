{{ define "content" }}
<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(clamp(160px, 45vw, 220px), 1fr)); gap: 1rem;">
  {{ range .Years }}
  <div>
    <a href="/year/{{ .URLName }}" class="has-text-dark">
      <div class="card">
        <div class="card-image">
          <figure class="image is-square" style="background: #f5f5f5;">
            {{ if .ThumbPath }}
            <img src="{{ .ThumbPath }}" alt="{{ .Name }}" loading="lazy"
                 style="object-fit: cover; width: 100%; height: 100%;">
            {{ else }}
            <div style="display:flex; align-items:center; justify-content:center; height:100%; position:absolute; width:100%;">
              <span class="icon is-large has-text-grey-light">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
                </svg>
              </span>
            </div>
            {{ end }}
          </figure>
        </div>
        <div class="card-content p-3">
          <p class="has-text-weight-bold is-size-4">{{ .Name }}</p>
          <p class="is-size-7 has-text-grey">{{ .AlbumCount }} album{{ if ne .AlbumCount 1 }}s{{ end }}</p>
        </div>
      </div>
    </a>
  </div>
  {{ else }}
  <div class="column">
    <div class="notification is-info is-light">
      No years found. Create a year folder (e.g. <code>media/2026/</code>) with album subfolders inside.
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
